<title>Rootloop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --soil-900:#141010; --soil-850:#191413; --soil-800:#1E1917; --soil-750:#25201C;
  --soil-700:#2E2721; --soil-600:#3B322A; --bark:#54473B;
  --wheat:#EDDCC3; --wheat-dim:#B0A08B; --wheat-faint:#7C7062;
  --chloro:#8FC93A; --chloro-deep:#5F8F22; --amber:#E9A23B; --water:#57B6C7;
  --rust:#D4573A; --gold:#F0C852; --bone:#DCD2BE;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --f-disp:'Chakra Petch',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--soil-900);color:var(--wheat);
  font-family:var(--f-body);font-size:14px;line-height:1.45;
  overscroll-behavior:none;
}
button,input,textarea,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chloro);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--soil-600);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100dvh;max-width:1400px;margin:0 auto}

/* ---------- HUD ---------- */
.hud{
  display:flex;align-items:center;gap:10px;padding:8px 10px 6px;
  background:linear-gradient(var(--soil-850),var(--soil-900));
  border-bottom:1px solid var(--soil-700);flex:none;
}
.brand{display:flex;align-items:center;gap:7px;flex:none}
.mark{width:18px;height:18px;border-radius:4px;flex:none;
  background:conic-gradient(from 45deg,var(--chloro),var(--amber),var(--chloro-deep),var(--chloro));
  box-shadow:0 0 0 1px var(--soil-600), 0 0 12px -2px var(--chloro)}
.brand h1{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;margin:0;white-space:nowrap}
.strip{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{
  display:flex;align-items:center;gap:5px;flex:none;padding:3px 8px 3px 6px;
  background:var(--soil-800);border:1px solid var(--soil-700);border-radius:99px;
  font-family:var(--f-mono);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;
  color:var(--wheat-dim);white-space:nowrap;
}
.chip b{color:var(--wheat);font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:2px;flex:none}
.chip.pulse{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.09);border-color:var(--chloro)}100%{transform:scale(1)}}

/* ---------- Field ---------- */
.field{
  position:relative;flex:none;height:min(38dvh,88vw);min-height:180px;
  margin:8px 8px 0;border-radius:var(--r-l);
  background:var(--soil-850);
  border:1px solid var(--soil-700);
  box-shadow:inset 0 0 0 4px var(--soil-850), inset 0 2px 24px rgba(0,0,0,.6);
  overflow:hidden;
}
.field canvas{display:block;width:100%;height:100%;touch-action:none}
.field::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:var(--r-l);
  background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.45) 100%);
}
.readout{
  position:absolute;left:8px;bottom:8px;display:flex;gap:6px;pointer-events:none;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;
}
.readout span{background:rgba(15,12,11,.72);border:1px solid var(--soil-700);
  padding:2px 6px;border-radius:var(--r-s);color:var(--wheat-dim)}
.readout b{color:var(--chloro);font-weight:500}
.flag{
  position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:99px;
  font-family:var(--f-disp);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--soil-600);background:rgba(15,12,11,.78);color:var(--wheat-faint);
}
.flag.on{color:var(--chloro);border-color:var(--chloro-deep);box-shadow:0 0 14px -4px var(--chloro)}
.flag.err{color:var(--rust);border-color:var(--rust)}

/* ---------- Run bar ---------- */
.runbar{
  display:flex;align-items:center;gap:8px;padding:8px;flex:none;
}
.btn{
  border:1px solid var(--soil-600);background:var(--soil-750);color:var(--wheat);
  border-radius:var(--r-m);padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:transform .08s ease,background .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(var(--chloro),var(--chloro-deep));border-color:#43690f;color:#12180a;
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 18px -10px var(--chloro)}
.btn.stop{color:var(--rust)}
.btn.small{padding:5px 9px;font-size:12px;border-radius:var(--r-s)}
.speedwrap{display:flex;align-items:center;gap:7px;flex:1;min-width:0;
  background:var(--soil-800);border:1px solid var(--soil-700);border-radius:var(--r-m);padding:5px 10px}
.speedwrap label{font-family:var(--f-disp);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--wheat-faint)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:40px;height:20px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:var(--soil-600)}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:var(--soil-600)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;
  border-radius:50%;background:var(--amber);border:2px solid var(--soil-900);box-shadow:0 0 10px -2px var(--amber)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--soil-900);border-radius:50%;background:var(--amber)}
.tps{font-family:var(--f-mono);font-size:11px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;padding:0 8px;flex:none;border-bottom:1px solid var(--soil-700)}
.tab{
  flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:9px 4px 8px;
  font-family:var(--f-disp);font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--wheat-faint);cursor:pointer;position:relative;
}
.tab.active{color:var(--wheat);border-bottom-color:var(--chloro)}
.tab .badge{position:absolute;top:4px;right:6px;min-width:15px;height:15px;border-radius:99px;
  background:var(--amber);color:#20170a;font-family:var(--f-body);font-size:9.5px;font-weight:700;line-height:15px}
.dock{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.pane.active{display:flex}

/* ---------- Code ---------- */
.files{display:flex;gap:6px;padding:8px;overflow-x:auto;flex:none;scrollbar-width:none;align-items:center}
.files::-webkit-scrollbar{display:none}
.file{
  flex:none;padding:5px 10px;border-radius:99px;border:1px solid var(--soil-700);background:var(--soil-800);
  font-family:var(--f-mono);font-size:11.5px;color:var(--wheat-dim);cursor:pointer;white-space:nowrap;
}
.file.active{background:var(--soil-700);border-color:var(--bark);color:var(--wheat)}
.editor{position:relative;flex:1;min-height:0;margin:0 8px;border-radius:var(--r-m);
  background:var(--soil-850);border:1px solid var(--soil-700);overflow:hidden}
.editor pre,.editor textarea{
  margin:0;padding:10px 12px;font-family:var(--f-mono);font-size:13px;line-height:1.55;
  white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;tab-size:4;
  border:0;background:transparent;
}
.editor pre{position:absolute;inset:0;overflow:auto;pointer-events:none;color:var(--wheat)}
.editor textarea{
  position:absolute;inset:0;width:100%;height:100%;resize:none;overflow:auto;
  color:transparent;caret-color:var(--amber);outline:none;-webkit-text-fill-color:transparent;
}
.editor textarea::selection{background:rgba(143,201,58,.3);-webkit-text-fill-color:transparent}
.tk-kw{color:#E4788F}.tk-def{color:var(--amber)}.tk-num{color:var(--water)}
.tk-str{color:var(--chloro)}.tk-com{color:var(--wheat-faint);font-style:italic}
.tk-api{color:#9FD8E6}.tk-const{color:var(--gold)}.tk-op{color:var(--wheat-dim)}
.keys{display:flex;gap:5px;padding:8px;overflow-x:auto;flex:none;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.key{flex:none;padding:7px 10px;border-radius:var(--r-s);border:1px solid var(--soil-700);
  background:var(--soil-800);font-family:var(--f-mono);font-size:12px;color:var(--wheat-dim);cursor:pointer}
.key:active{background:var(--soil-700)}
.key.wide{color:var(--chloro)}

/* ---------- Shop ---------- */
.paneScroll{overflow-y:auto;padding:10px 8px 24px;flex:1;-webkit-overflow-scrolling:touch}
.secTitle{font-family:var(--f-disp);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--wheat-faint);margin:14px 4px 8px;display:flex;align-items:center;gap:8px}
.secTitle:first-child{margin-top:2px}
.secTitle::after{content:"";flex:1;height:1px;background:var(--soil-700)}
.buys{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.buy{
  display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
  padding:10px 11px;border-radius:var(--r-m);background:var(--soil-800);
  border:1px solid var(--soil-700);
}
.buy.owned{background:transparent;border-style:dashed;opacity:.62}
.buy.locked{opacity:.5}
.buy h3{grid-column:1;margin:0;font-family:var(--f-disp);font-size:13.5px;font-weight:600;letter-spacing:.02em}
.buy p{grid-column:1/-1;margin:0;font-size:12px;color:var(--wheat-dim);line-height:1.4}
.buy .price{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:var(--r-s);
  background:var(--soil-750);border:1px solid var(--soil-700);color:var(--wheat-dim);font-variant-numeric:tabular-nums}
.tag.short{color:var(--rust);border-color:#5a2a1e}
.buy .btn{grid-row:1;grid-column:2}
.lvl{font-family:var(--f-mono);font-size:11px;color:var(--amber)}

/* ---------- Log ---------- */
.log{flex:1;overflow-y:auto;padding:10px 12px 20px;font-family:var(--f-mono);font-size:12px;line-height:1.6}
.log div{white-space:pre-wrap;overflow-wrap:break-word;border-bottom:1px solid rgba(255,255,255,.03);padding:1px 0}
.log .e{color:var(--rust)}.log .s{color:var(--chloro)}.log .i{color:var(--water)}

/* ---------- Guide ---------- */
.doc{max-width:66ch}
.doc h2{font-family:var(--f-disp);font-size:15px;letter-spacing:.03em;margin:20px 0 6px;color:var(--wheat)}
.doc h2:first-child{margin-top:4px}
.doc p{margin:0 0 8px;color:var(--wheat-dim);font-size:13px}
.doc code{font-family:var(--f-mono);font-size:12px;background:var(--soil-800);border:1px solid var(--soil-700);
  padding:0 4px;border-radius:4px;color:var(--wheat)}
.doc pre{font-family:var(--f-mono);font-size:12px;background:var(--soil-850);border:1px solid var(--soil-700);
  border-radius:var(--r-m);padding:10px;overflow-x:auto;color:var(--wheat);line-height:1.55;margin:0 0 10px}
.api{display:flex;flex-direction:column;gap:0;border:1px solid var(--soil-700);border-radius:var(--r-m);overflow:hidden}
.api .row{display:grid;grid-template-columns:minmax(140px,auto) 1fr;gap:4px 12px;padding:7px 10px;
  border-bottom:1px solid var(--soil-800);background:var(--soil-850)}
.api .row:last-child{border-bottom:0}
.api .row code{background:none;border:0;padding:0;color:#9FD8E6}
.api .row span{font-size:12px;color:var(--wheat-dim)}
.api .row.lk code{color:var(--wheat-faint)}
.note{border-left:2px solid var(--amber);padding:2px 0 2px 10px;color:var(--wheat-dim);font-size:12.5px;margin:0 0 10px}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

@media (min-width:880px){
  #app{flex-direction:row;gap:0;max-width:none}
  .left{display:flex;flex-direction:column;flex:1.05;min-width:0;border-right:1px solid var(--soil-700)}
  .field{flex:1;height:auto;margin:8px}
  .right{display:flex;flex-direction:column;flex:1;min-width:0;max-width:640px}
  .hud{position:absolute;top:0;left:0;right:0;z-index:5;background:linear-gradient(var(--soil-900),rgba(20,16,16,.0))}
  .left{padding-top:44px}
  .right{padding-top:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>.left,.right{display:contents}
@media (min-width:880px){.left,.right{display:flex}}</style>

<div id="app">
  <header class="hud">
    <div class="brand"><span class="mark"></span><h1>Rootloop</h1></div>
    <div class="strip" id="strip"></div>
  </header>

  <div class="left">
    <section class="field">
      <canvas id="field"></canvas>
      <div class="flag" id="flag">idle</div>
      <div class="readout" id="readout"></div>
    </section>
    <div class="runbar">
      <button class="btn primary" id="runBtn">▶ Run</button>
      <button class="btn stop" id="stopBtn" disabled>■ Stop</button>
      <div class="speedwrap">
        <label for="speed">Speed</label>
        <input type="range" id="speed" min="0" max="12" step="1" value="4">
        <span class="tps" id="tps">10/s</span>
      </div>
    </div>
  </div>

  <div class="right">
    <nav class="tabs">
      <button class="tab active" data-pane="code">Code</button>
      <button class="tab" data-pane="shop">Shop<span class="badge" id="shopBadge" hidden>0</span></button>
      <button class="tab" data-pane="log">Log</button>
      <button class="tab" data-pane="guide">Guide</button>
    </nav>
    <main class="dock">
      <section class="pane active" id="pane-code">
        <div class="files" id="files"></div>
        <div class="editor">
          <pre id="hl" aria-hidden="true"></pre>
          <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"
            autocomplete="off" wrap="soft" aria-label="Python code editor"></textarea>
        </div>
        <div class="keys" id="keys"></div>
      </section>

      <section class="pane" id="pane-shop">
        <div class="paneScroll" id="shop"></div>
      </section>

      <section class="pane" id="pane-log">
        <div class="log" id="log"></div>
        <div class="keys">
          <button class="key wide" id="clearLog">clear log</button>
          <button class="key" id="resetGlobals">reset globals</button>
          <button class="key" id="clearFarm">clear farm</button>
        </div>
      </section>

      <section class="pane" id="pane-guide">
        <div class="paneScroll"><div class="doc" id="guide"></div></div>
      </section>
    </main>
  </div>
</div>
<script>
/* ==========================================================================
   ROOTLOOP — a Python subset: lexer, parser, and a generator-based evaluator
   that can pause on every drone action so the world can tick.
   ========================================================================== */
"use strict";

const KW = new Set(['if','elif','else','while','for','in','def','return','break','continue',
  'pass','and','or','not','True','False','None','global','nonlocal','try','except','finally',
  'raise','is','lambda','del','import','from','as','assert','while']);

class PyEx { constructor(type,msg){ this.type=type; this.msg=msg; } toString(){ return this.type+': '+this.msg; } }
class SyntaxErr extends Error { constructor(msg,line){ super(msg); this.line=line; this.syntax=true; } }
const err = (t,m)=>{ throw new PyEx(t,m); };

/* ------------------------------- lexer ---------------------------------- */
const OPS = ['**=','//=','>>=','<<=','**','//','==','!=','<=','>=','+=','-=','*=','/=','%=','&=','|=','^=','->','<<','>>',
  '(',')','[',']','{','}',',',':','.',';','+','-','*','/','%','<','>','=','~','&','|','^'];

function tokenize(src){
  src = String(src).replace(/\r\n?/g,'\n');
  const T=[], stack=[0];
  let i=0, line=1, depth=0, lineStart=true;
  const add=(t,v)=>T.push({t,v,line});
  while(i<src.length){
    if(lineStart){
      if(depth>0){ lineStart=false; continue; }
      let j=i, col=0;
      while(j<src.length && (src[j]===' '||src[j]==='\t')){ col += src[j]==='\t'?4:1; j++; }
      if(j>=src.length){ i=j; break; }
      if(src[j]==='\n'){ i=j+1; line++; continue; }
      if(src[j]==='#'){ while(j<src.length&&src[j]!=='\n') j++; i=j; continue; }
      i=j; lineStart=false;
      const top=stack[stack.length-1];
      if(col>top){ stack.push(col); add('INDENT'); }
      else if(col<top){
        while(col<stack[stack.length-1]){ stack.pop(); add('DEDENT'); }
        if(col!==stack[stack.length-1]) throw new SyntaxErr('indentation does not match any block',line);
      }
      continue;
    }
    const c=src[i];
    if(c==='\n'){ i++; if(depth===0){ add('NEWLINE'); lineStart=true; } line++; continue; }
    if(c===' '||c==='\t'||c==='\r'){ i++; continue; }
    if(c==='#'){ while(i<src.length&&src[i]!=='\n') i++; continue; }
    if(c==='\\'&&src[i+1]==='\n'){ i+=2; line++; continue; }

    const sm = /^([fFrRbBuU]{0,2})('''|"""|'|")/.exec(src.slice(i));
    if(sm){
      const pref=sm[1].toLowerCase(), q=sm[2];
      let j=i+sm[0].length, raw='';
      while(true){
        if(j>=src.length) throw new SyntaxErr('unterminated string',line);
        if(src.startsWith(q,j)){ j+=q.length; break; }
        if(src[j]==='\\' && !pref.includes('r')){ raw+=src[j]+src[j+1]; if(src[j+1]==='\n') line++; j+=2; continue; }
        if(src[j]==='\n'){ if(q.length===1) throw new SyntaxErr('unterminated string',line); line++; }
        raw+=src[j]; j++;
      }
      i=j;
      if(pref.includes('f')) add('FSTR',raw);
      else add('STR', pref.includes('r') ? raw : unescapeStr(raw));
      continue;
    }
    const nm = /^(0[xX][0-9a-fA-F_]+|(?:\d[\d_]*\.?[\d_]*|\.\d[\d_]*)(?:[eE][+-]?\d+)?)/.exec(src.slice(i));
    if(nm && /[\d.]/.test(c)){
      const txt=nm[0].replace(/_/g,'');
      add('NUM', txt.startsWith('0x')||txt.startsWith('0X') ? parseInt(txt,16) : parseFloat(txt));
      i+=nm[0].length; continue;
    }
    const im = /^[A-Za-z_][A-Za-z0-9_]*/.exec(src.slice(i));
    if(im){ const w=im[0]; add(KW.has(w)?'KW':'NAME', w); i+=w.length; continue; }
    let matched=null;
    for(const op of OPS) if(src.startsWith(op,i)){ matched=op; break; }
    if(!matched) throw new SyntaxErr('unexpected character '+JSON.stringify(c),line);
    if('([{'.includes(matched)) depth++;
    if(')]}'.includes(matched)) depth=Math.max(0,depth-1);
    add('OP',matched); i+=matched.length; continue;
  }
  add('NEWLINE');
  while(stack.length>1){ stack.pop(); add('DEDENT'); }
  add('EOF');
  return T;
}
function unescapeStr(s){
  return s.replace(/\\(u[0-9a-fA-F]{4}|x[0-9a-fA-F]{2}|.|\n)/g,(m,g)=>{
    if(g[0]==='u') return String.fromCharCode(parseInt(g.slice(1),16));
    if(g[0]==='x') return String.fromCharCode(parseInt(g.slice(1),16));
    return {n:'\n',t:'\t',r:'\r','\\':'\\',"'":"'",'"':'"','0':'\0','\n':''}[g] ?? g;
  });
}

/* ------------------------------- parser --------------------------------- */
function parse(src){
  const T=tokenize(src);
  let p=0;
  const pk=(k=0)=>T[Math.min(p+k,T.length-1)];
  const at=(t,v)=>{ const x=pk(); return x.t===t && (v===undefined||x.v===v); };
  const atOp=v=>at('OP',v), atKw=v=>at('KW',v);
  const next=()=>T[p++];
  const eat=(t,v)=>{ if(at(t,v)){ return T[p++]; } return null; };
  const need=(t,v)=>{ if(at(t,v)) return T[p++];
    throw new SyntaxErr('expected '+(v||t)+', found '+(pk().v??pk().t), pk().line); };
  const skipNL=()=>{ while(at('NEWLINE')) p++; };

  function block(){
    need('OP',':');
    if(at('NEWLINE')){
      p++; skipNL(); need('INDENT');
      const body=[];
      while(!at('DEDENT') && !at('EOF')){ const s=statement(); if(s) body.push(s); skipNL(); }
      eat('DEDENT');
      return body;
    }
    const body=[]; // inline suite:  if x: y = 1
    do { const s=simpleStmt(); if(s) body.push(s); } while(eat('OP',';') && !at('NEWLINE'));
    eat('NEWLINE');
    return body;
  }

  function statement(){
    skipNL();
    const ln=pk().line;
    if(atKw('if')) return ifStmt();
    if(atKw('while')){ p++; const test=expr(); const body=block(); let orelse=[];
      skipNL(); if(atKw('else')){ p++; orelse=block(); } return {k:'While',test,body,orelse,ln}; }
    if(atKw('for')){ p++; const tgt=targetList(); need('KW','in'); const iter=exprList(); const body=block();
      let orelse=[]; skipNL(); if(atKw('else')){ p++; orelse=block(); } return {k:'For',tgt,iter,body,orelse,ln}; }
    if(atKw('def')){ p++; const name=need('NAME').v; return {k:'Def',name,...params(),body:block(),ln}; }
    if(atKw('try')) return tryStmt();
    if(at('NAME') && pk().v==='class') { throw new SyntaxErr('classes are not supported',ln); }
    const s=simpleStmt();
    while(eat('OP',';')){ if(at('NEWLINE')) break; const s2=simpleStmt(); if(s2) return {k:'Seq',body:[s,s2],ln}; }
    eat('NEWLINE');
    return s;
  }
  function ifStmt(){
    const ln=pk().line; next();
    const test=expr(), body=block(); let orelse=[];
    skipNL();
    if(atKw('elif')) orelse=[ifStmt()];
    else if(atKw('else')){ p++; orelse=block(); }
    return {k:'If',test,body,orelse,ln};
  }
  function tryStmt(){
    const ln=pk().line; next();
    const body=block(); const handlers=[]; let orelse=[],fin=[];
    skipNL();
    while(atKw('except')){
      p++; let type=null,name=null;
      if(!atOp(':')){ type=expr(); if(atKw('as')){ p++; name=need('NAME').v; } }
      handlers.push({type,name,body:block()}); skipNL();
    }
    if(atKw('else')){ p++; orelse=block(); skipNL(); }
    if(atKw('finally')){ p++; fin=block(); }
    return {k:'Try',body,handlers,orelse,fin,ln};
  }
  function params(){
    need('OP','(');
    const names=[],defs=[]; let star=null;
    while(!atOp(')')){
      if(eat('OP','*')){ star=need('NAME').v; }
      else{
        names.push(need('NAME').v);
        if(eat('OP','=')) defs.push(expr()); else if(defs.length) defs.push(null); else defs.push(null);
      }
      if(!eat('OP',',')) break;
    }
    need('OP',')');
    if(eat('OP','->')) expr();
    return {names,defs,star};
  }
  function targetList(){
    const t=[target()];
    while(eat('OP',',')){ if(atKw('in')) break; t.push(target()); }
    return t.length===1?t[0]:{k:'Tuple',items:t};
  }
  function target(){ return postfix(atom()); }

  function simpleStmt(){
    const ln=pk().line;
    if(atKw('pass')){ p++; return {k:'Pass',ln}; }
    if(atKw('break')){ p++; return {k:'Break',ln}; }
    if(atKw('continue')){ p++; return {k:'Continue',ln}; }
    if(atKw('return')){ p++; const v = (at('NEWLINE')||at('EOF')||atOp(';'))?null:exprList(); return {k:'Return',value:v,ln}; }
    if(atKw('raise')){ p++; const v=(at('NEWLINE')||at('EOF'))?null:expr(); return {k:'Raise',value:v,ln}; }
    if(atKw('global')||atKw('nonlocal')){ p++; const names=[need('NAME').v];
      while(eat('OP',',')) names.push(need('NAME').v); return {k:'Global',names,ln}; }
    if(atKw('del')){ p++; const t=[expr()]; while(eat('OP',',')) t.push(expr()); return {k:'Del',targets:t,ln}; }
    if(atKw('assert')){ p++; const t=expr(); let m=null; if(eat('OP',',')) m=expr(); return {k:'Assert',test:t,msg:m,ln}; }
    if(atKw('import')){ while(!at('NEWLINE')&&!at('EOF')) p++; return {k:'Pass',ln}; }
    if(atKw('from')){ while(!at('NEWLINE')&&!at('EOF')) p++; return {k:'Pass',ln}; }
    const first=exprList();
    const aug=['+=','-=','*=','/=','//=','%=','**=','&=','|=','^=','<<=','>>='];
    for(const a of aug) if(atOp(a)){ p++; const v=exprList(); return {k:'Aug',target:first,op:a.slice(0,-1),value:v,ln}; }
    if(atOp('=')){
      const targets=[first];
      while(eat('OP','=')){ targets.push(exprList()); }
      const value=targets.pop();
      return {k:'Assign',targets,value,ln};
    }
    return {k:'ExprStmt',value:first,ln};
  }

  function exprList(){
    const first=expr();
    if(!atOp(',')) return first;
    const items=[first];
    while(eat('OP',',')){
      if(at('NEWLINE')||at('EOF')||atOp(')')||atOp(']')||atOp('}')||atOp('=')) break;
      items.push(expr());
    }
    return {k:'Tuple',items};
  }
  function expr(){ return ternary(); }
  function ternary(){
    const v=orExpr();
    if(atKw('if')){ p++; const test=orExpr(); need('KW','else'); const other=ternary();
      return {k:'Cond',test,then:v,other}; }
    return v;
  }
  function orExpr(){ let l=andExpr(); while(atKw('or')){ p++; l={k:'Bool',op:'or',l,r:andExpr()}; } return l; }
  function andExpr(){ let l=notExpr(); while(atKw('and')){ p++; l={k:'Bool',op:'and',l,r:notExpr()}; } return l; }
  function notExpr(){ if(atKw('not')){ p++; return {k:'Not',v:notExpr()}; } return comparison(); }
  function comparison(){
    let l=arith();
    const ops=[],rs=[];
    while(true){
      let op=null;
      if(at('OP')&&['<','>','<=','>=','==','!='].includes(pk().v)){ op=pk().v; p++; }
      else if(atKw('in')){ op='in'; p++; }
      else if(atKw('not')&&pk(1).t==='KW'&&pk(1).v==='in'){ op='not in'; p+=2; }
      else if(atKw('is')){ p++; if(atKw('not')){ p++; op='is not'; } else op='is'; }
      else break;
      ops.push(op); rs.push(arith());
    }
    if(!ops.length) return l;
    return {k:'Cmp',left:l,ops,rs};
  }
  const bin=(sub,list)=>function(){ let l=sub(); while(at('OP')&&list.includes(pk().v)){ const op=next().v; l={k:'Bin',op,l,r:sub()}; } return l; };
  const bitOr = bin(()=>bitXor(), ['|']);
  const bitXor = bin(()=>bitAnd(), ['^']);
  const bitAnd = bin(()=>shift(), ['&']);
  const shift  = bin(()=>addsub(), ['<<','>>']);
  const addsub = bin(()=>muldiv(), ['+','-']);
  const muldiv = bin(()=>unary(), ['*','/','//','%']);
  function arith(){ return bitOr(); }
  function unary(){
    if(atOp('-')){ p++; return {k:'Neg',v:unary()}; }
    if(atOp('+')){ p++; return unary(); }
    if(atOp('~')){ p++; return {k:'Inv',v:unary()}; }
    return power();
  }
  function power(){ const b=postfix(atom()); if(atOp('**')){ p++; return {k:'Bin',op:'**',l:b,r:unary()}; } return b; }

  function postfix(node){
    while(true){
      if(atOp('(')){
        p++; const args=[],kw={};
        while(!atOp(')')){
          if(at('NAME')&&pk(1).t==='OP'&&pk(1).v==='='&&!(pk(2).t==='OP'&&pk(2).v==='=')){
            const n=next().v; p++; kw[n]=expr();
          } else if(atOp('*')){ p++; args.push({k:'Star',v:expr()}); }
          else args.push(expr());
          if(!eat('OP',',')) break;
        }
        need('OP',')');
        node={k:'Call',fn:node,args,kw,ln:pk().line};
      } else if(atOp('[')){
        p++;
        let lo=null,hi=null,step=null,isSlice=false;
        if(!atOp(':')) lo=exprList();
        if(atOp(':')){ isSlice=true; p++; if(!atOp(']')&&!atOp(':')) hi=expr();
          if(atOp(':')){ p++; if(!atOp(']')) step=expr(); } }
        need('OP',']');
        node = isSlice ? {k:'Slice',obj:node,lo,hi,step} : {k:'Sub',obj:node,idx:lo};
      } else if(atOp('.')){
        p++; const name=need('NAME').v; node={k:'Attr',obj:node,name};
      } else break;
    }
    return node;
  }

  function comprehension(kind,elt,elt2){
    p++; // 'for'
    const tgt=targetList(); need('KW','in'); const iter=orExpr();
    let cond=null; if(atKw('if')){ p++; cond=orExpr(); }
    return {k:'Comp',kind,elt,elt2,tgt,iter,cond};
  }

  function atom(){
    const tk=pk();
    if(tk.t==='NUM'){ p++; return {k:'Num',v:tk.v}; }
    if(tk.t==='STR'){ let s=''; while(at('STR')) s+=next().v; return {k:'Str',v:s}; }
    if(tk.t==='FSTR'){ p++; return fstring(tk.v,tk.line); }
    if(tk.t==='NAME'){ p++; return {k:'Name',v:tk.v,ln:tk.line}; }
    if(tk.t==='KW'){
      if(tk.v==='True'){ p++; return {k:'Const',v:true}; }
      if(tk.v==='False'){ p++; return {k:'Const',v:false}; }
      if(tk.v==='None'){ p++; return {k:'Const',v:null}; }
      if(tk.v==='not'){ return notExpr(); }
      if(tk.v==='lambda'){ p++; const names=[],defs=[];
        while(!atOp(':')){ names.push(need('NAME').v); defs.push(eat('OP','=')?expr():null); if(!eat('OP',',')) break; }
        need('OP',':'); const body=expr();
        return {k:'Lambda',names,defs,star:null,body}; }
    }
    if(atOp('(')){
      p++;
      if(atOp(')')){ p++; return {k:'Tuple',items:[]}; }
      const first=expr();
      if(atKw('for')){ const c=comprehension('list',first); need('OP',')'); return c; }
      if(atOp(',')){
        const items=[first];
        while(eat('OP',',')){ if(atOp(')')) break; items.push(expr()); }
        need('OP',')'); return {k:'Tuple',items};
      }
      need('OP',')'); return first;
    }
    if(atOp('[')){
      p++;
      if(atOp(']')){ p++; return {k:'List',items:[]}; }
      const first=expr();
      if(atKw('for')){ const c=comprehension('list',first); need('OP',']'); return c; }
      const items=[first];
      while(eat('OP',',')){ if(atOp(']')) break; items.push(expr()); }
      need('OP',']'); return {k:'List',items};
    }
    if(atOp('{')){
      p++;
      if(atOp('}')){ p++; return {k:'Dict',pairs:[]}; }
      const first=expr();
      if(atOp(':')){
        p++; const v1=expr();
        if(atKw('for')){ const c=comprehension('dict',first,v1); need('OP','}'); return c; }
        const pairs=[[first,v1]];
        while(eat('OP',',')){ if(atOp('}')) break; const k1=expr(); need('OP',':'); pairs.push([k1,expr()]); }
        need('OP','}'); return {k:'Dict',pairs};
      }
      if(atKw('for')){ const c=comprehension('set',first); need('OP','}'); return c; }
      const items=[first];
      while(eat('OP',',')){ if(atOp('}')) break; items.push(expr()); }
      need('OP','}'); return {k:'SetLit',items};
    }
    throw new SyntaxErr('unexpected '+(tk.v??tk.t), tk.line);
  }

  function fstring(raw,line){
    const parts=[]; let buf='';
    for(let i=0;i<raw.length;i++){
      const c=raw[i];
      if(c==='{'&&raw[i+1]==='{'){ buf+='{'; i++; continue; }
      if(c==='}'&&raw[i+1]==='}'){ buf+='}'; i++; continue; }
      if(c==='{'){
        if(buf){ parts.push({k:'Str',v:unescapeStr(buf)}); buf=''; }
        let d=1,j=i+1,inner='';
        while(j<raw.length&&d>0){ if(raw[j]==='{')d++; else if(raw[j]==='}'){d--; if(!d)break;} inner+=raw[j]; j++; }
        i=j;
        let spec=null;
        const cm=/:([^:]*)$/.exec(inner);
        if(cm && !inner.slice(0,cm.index).includes('[')){ spec=cm[1]; inner=inner.slice(0,cm.index); }
        if(inner.endsWith('=')){ parts.push({k:'Str',v:inner+' '}); inner=inner.slice(0,-1); }
        let sub;
        try{ sub=parse(inner).body[0].value; }
        catch(e){ throw new SyntaxErr('bad f-string expression: '+inner,line); }
        parts.push({k:'Fmt',v:sub,spec});
        continue;
      }
      buf+=c;
    }
    if(buf) parts.push({k:'Str',v:unescapeStr(buf)});
    return {k:'JStr',parts};
  }

  const body=[];
  skipNL();
  while(!at('EOF')){ const s=statement(); if(s) body.push(s); skipNL(); }
  return {k:'Module',body};
}

<script>
/* ===================== runtime values & evaluator ======================== */
class PyDict{
  constructor(){ this.m=new Map(); }
  static kk(k){ return (k&&k.__sym) ? 'S:'+k.kind+':'+k.name : (Array.isArray(k)? 'T:'+k.map(PyDict.kk).join('|') : typeof k+':'+k); }
  get(k,d){ const e=this.m.get(PyDict.kk(k)); return e?e[1]:d; }
  has(k){ return this.m.has(PyDict.kk(k)); }
  set(k,v){ this.m.set(PyDict.kk(k),[k,v]); }
  del(k){ return this.m.delete(PyDict.kk(k)); }
  get size(){ return this.m.size; }
  keys(){ return [...this.m.values()].map(e=>e[0]); }
  values(){ return [...this.m.values()].map(e=>e[1]); }
  entries(){ return [...this.m.values()].map(e=>tup([e[0],e[1]])); }
}
class PySet{
  constructor(items){ this.m=new Map(); if(items) for(const it of items) this.add(it); }
  add(v){ this.m.set(PyDict.kk(v),v); }
  has(v){ return this.m.has(PyDict.kk(v)); }
  del(v){ return this.m.delete(PyDict.kk(v)); }
  get size(){ return this.m.size; }
  items(){ return [...this.m.values()]; }
}
class PyRange{
  constructor(a,b,s){ this.start=a; this.stop=b; this.step=s;
    this.length=Math.max(0,Math.ceil((b-a)/s)); }
  at(i){ return this.start+this.step*i; }
  *[Symbol.iterator](){ for(let i=0;i<this.length;i++) yield this.start+this.step*i; }
}
class PyFunc{
  constructor(name,names,defs,star,body,scope,isLambda){
    Object.assign(this,{name,names,defs,star,body,scope,isLambda}); }
}
class Scope{
  constructor(parent,globals){ this.v=new Map(); this.parent=parent||null;
    this.g=globals||(parent?parent.g:this.v); this.decl=null; }
  lookup(n){
    let s=this;
    while(s){ if(s.v.has(n)) return s.v; s=s.parent; }
    if(this.g.has(n)) return this.g;
    return null;
  }
  get(n){ const m=this.lookup(n); if(!m) err('NameError',"name '"+n+"' is not defined"); return m.get(n); }
  set(n,val){ if(this.decl&&this.decl.has(n)) this.g.set(n,val); else this.v.set(n,val); }
}
const tup=a=>{ a.tup=true; return a; };
const nat=(name,fn,gen)=>({__nat:true,name,fn,gen:!!gen});
const sym=(kind,name,data)=>Object.assign({__sym:true,kind,name},data||{});
const ns=(name,props)=>({__ns:true,name,props});

let RT = null;
class Ret{ constructor(v){ this.v=v; } }
const BRK={__brk:1}, CNT={__cnt:1};

function truthy(v){
  if(v===null||v===false||v===undefined) return false;
  if(v===true) return true;
  if(typeof v==='number') return v!==0;
  if(typeof v==='string') return v.length>0;
  if(Array.isArray(v)) return v.length>0;
  if(v instanceof PyDict||v instanceof PySet) return v.size>0;
  if(v instanceof PyRange) return v.length>0;
  return true;
}
function typeName(v){
  if(v===null||v===undefined) return 'NoneType';
  if(typeof v==='boolean') return 'bool';
  if(typeof v==='number') return Number.isInteger(v)?'int':'float';
  if(typeof v==='string') return 'str';
  if(Array.isArray(v)) return v.tup?'tuple':'list';
  if(v instanceof PyDict) return 'dict';
  if(v instanceof PySet) return 'set';
  if(v instanceof PyRange) return 'range';
  if(v instanceof PyFunc||(v&&v.__nat)) return 'function';
  if(v&&v.__sym) return v.kind;
  if(v&&v.__ns) return 'namespace';
  return 'object';
}
function fmtNum(n){
  if(Number.isNaN(n)) return 'nan';
  if(!isFinite(n)) return n>0?'inf':'-inf';
  if(Number.isInteger(n)) return String(n);
  if(Math.abs(n)>=1e16||(Math.abs(n)<1e-4&&n!==0)) return String(n);
  return String(parseFloat(n.toFixed(10)));
}
function pyStr(v){
  if(v===null||v===undefined) return 'None';
  if(v===true) return 'True';
  if(v===false) return 'False';
  if(typeof v==='number') return fmtNum(v);
  if(typeof v==='string') return v;
  if(Array.isArray(v)) return v.tup ? '('+v.map(pyRepr).join(', ')+(v.length===1?',':'')+')' : '['+v.map(pyRepr).join(', ')+']';
  if(v instanceof PyDict) return '{'+[...v.m.values()].map(e=>pyRepr(e[0])+': '+pyRepr(e[1])).join(', ')+'}';
  if(v instanceof PySet) return v.size?'{'+v.items().map(pyRepr).join(', ')+'}':'set()';
  if(v instanceof PyRange) return 'range('+v.start+', '+v.stop+(v.step!==1?', '+v.step:'')+')';
  if(v instanceof PyFunc) return '<function '+v.name+'>';
  if(v&&v.__nat) return '<built-in function '+v.name+'>';
  if(v&&v.__sym) return v.kind+'.'+v.name;
  if(v&&v.__ns) return '<'+v.name+'>';
  return String(v);
}
function pyRepr(v){
  if(typeof v!=='string') return pyStr(v);
  return "'"+v.split('\\').join('\\\\').split("'").join("\\'").split('\n').join('\\n')+"'";
}
function pyEq(a,b){
  if(a===b) return true;
  if(a===null||a===undefined||b===null||b===undefined) return (a??null)===(b??null);
  if(typeof a==='boolean'&&typeof b==='number') return (a?1:0)===b;
  if(typeof b==='boolean'&&typeof a==='number') return (b?1:0)===a;
  if(Array.isArray(a)&&Array.isArray(b)) return a.length===b.length&&a.every((x,i)=>pyEq(x,b[i]));
  if(a&&b&&a.__sym&&b.__sym) return a.kind===b.kind&&a.name===b.name;
  if(a instanceof PyDict&&b instanceof PyDict){
    if(a.size!==b.size) return false;
    for(const [k,e] of a.m){ if(!b.m.has(k)||!pyEq(e[1],b.m.get(k)[1])) return false; }
    return true;
  }
  if(a instanceof PySet&&b instanceof PySet){
    if(a.size!==b.size) return false;
    for(const k of a.m.keys()) if(!b.m.has(k)) return false;
    return true;
  }
  return false;
}
function cmpVals(a,b){
  if(typeof a==='boolean') a=a?1:0;
  if(typeof b==='boolean') b=b?1:0;
  if(typeof a==='number'&&typeof b==='number') return a<b?-1:a>b?1:0;
  if(typeof a==='string'&&typeof b==='string') return a<b?-1:a>b?1:0;
  if(Array.isArray(a)&&Array.isArray(b)){
    const n=Math.min(a.length,b.length);
    for(let i=0;i<n;i++){ const c=cmpVals(a[i],b[i]); if(c) return c; }
    return a.length-b.length;
  }
  if(a&&b&&a.__sym&&b.__sym) return a.name<b.name?-1:a.name>b.name?1:0;
  err('TypeError',"'<' not supported between '"+typeName(a)+"' and '"+typeName(b)+"'");
}
function pyLen(v){
  if(typeof v==='string'||Array.isArray(v)) return v.length;
  if(v instanceof PyDict||v instanceof PySet) return v.size;
  if(v instanceof PyRange) return v.length;
  err('TypeError',"object of type '"+typeName(v)+"' has no len()");
}
function toList(v){
  if(Array.isArray(v)) return v.slice();
  if(typeof v==='string') return v.split('');
  if(v instanceof PyRange) return [...v];
  if(v instanceof PyDict) return v.keys();
  if(v instanceof PySet) return v.items();
  err('TypeError',"'"+typeName(v)+"' object is not iterable");
}
function contains(box,item){
  if(typeof box==='string') return typeof item==='string' && box.includes(item);
  if(Array.isArray(box)) return box.some(x=>pyEq(x,item));
  if(box instanceof PyDict) return box.has(item);
  if(box instanceof PySet) return box.has(item);
  if(box instanceof PyRange){
    if(typeof item!=='number') return false;
    const d=(item-box.start)/box.step;
    return Number.isInteger(d)&&d>=0&&d<box.length;
  }
  err('TypeError',"argument of type '"+typeName(box)+"' is not iterable");
}
function numOf(v,op){
  if(typeof v==='number') return v;
  if(typeof v==='boolean') return v?1:0;
  err('TypeError',"unsupported operand type for "+op+": '"+typeName(v)+"'");
}
function binop(op,a,b){
  if(op==='+'){
    if(typeof a==='string'||typeof b==='string'){
      if(typeof a!=='string'||typeof b!=='string')
        err('TypeError','can only concatenate str to str');
      return a+b;
    }
    if(Array.isArray(a)&&Array.isArray(b)) return a.concat(b);
    return numOf(a,'+')+numOf(b,'+');
  }
  if(op==='*'){
    if(typeof a==='string'&&typeof b==='number') return b>0?a.repeat(Math.floor(b)):'';
    if(typeof b==='string'&&typeof a==='number') return a>0?b.repeat(Math.floor(a)):'';
    if(Array.isArray(a)&&typeof b==='number'){ let r=[]; for(let i=0;i<Math.floor(b);i++) r=r.concat(a); return r; }
    if(Array.isArray(b)&&typeof a==='number'){ let r=[]; for(let i=0;i<Math.floor(a);i++) r=r.concat(b); return r; }
    return numOf(a,'*')*numOf(b,'*');
  }
  const x=numOf(a,op), y=numOf(b,op);
  switch(op){
    case '-': return x-y;
    case '/': if(y===0) err('ZeroDivisionError','division by zero'); return x/y;
    case '//': if(y===0) err('ZeroDivisionError','division by zero'); return Math.floor(x/y);
    case '%': if(y===0) err('ZeroDivisionError','division by zero'); return x-Math.floor(x/y)*y;
    case '**': return Math.pow(x,y);
    case '&': return x&y;
    case '|': return x|y;
    case '^': return x^y;
    case '<<': return x<<y;
    case '>>': return x>>y;
  }

const FEED_ITEMS=['Hay','Wood','Carrot','Pumpkin'];

const Items    = ns('Items',    Object.fromEntries(ITEMS.map(n=>[n,sym('Items',n)])));

const SIZES=[3,4,5,6,8,10,12,14,18,22,26];
const TPS=[4,6,9,13,19,28,42,63,95,140,210,320,480];

const state = {
  items:Object.fromEntries(ITEMS.map(i=>[i,0])),
  unlocked:{},
  expand:0, speed:0, speedPref:0,
  credit:0, treasures:0,
  wanted:'Hay', wantedAt:0
};
const world = {
  size:3, tiles:[], time:0, maze:false,
  drone:{x:0,y:0,dir:NORTH,vx:0,vy:0,flip:0,bump:0},

function newTile(){ return {g:'Grassland',e:'Grass',age:Math.random()*SPEC.Grass.grow,water:0,d:null}; }
function buildWorld(size,keep){

  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    world.tiles[y*size+x] = (keep && x<os && y<os) ? old[y*os+x] : newTile();
  }
  world.drone.x=Math.min(world.drone.x,size-1);
  world.drone.y=Math.min(world.drone.y,size-1);

}
const wrap=(v)=>((v%world.size)+world.size)%world.size;
const tileAt=(x,y)=>world.tiles[wrap(y)*world.size+wrap(x)];
const here=()=>tileAt(world.drone.x,world.drone.y);
const isMature=t=>t.e && t.age>=SPEC[t.e].grow && (t.e!=='Dinosaur'||(t.d&&t.d.fed>=5));

function growthRate(t){

}
function advanceWorld(dt){
  if(dt<=0) return;
  world.time+=dt;

  for(let i=0;i<T.length;i++){
    const t=T[i];
    if(t.water>0) t.water=Math.max(0,t.water-dt*0.0022);
    if(!t.e) continue;
    const sp=SPEC[t.e];
    if(sp.grow>0 && t.age<sp.grow) t.age=Math.min(sp.grow,t.age+dt*growthRate(t));
  }
  if(world.time-state.wantedAt>500){
    state.wantedAt=world.time;
    const pool=Object.keys(TRADE_VALUE).filter(k=>state.unlocked[unlockForItem(k)]!==undefined||k==='Hay');

function unlockForItem(k){

}
function give(item,n){
  state.items[item]=(state.items[item]||0)+n;
  UI.bump(item);
}
function fx(x,y,text,color){
  world.fx.push({x,y,text,color,t:0});
  if(world.fx.length>40) world.fx.shift();
}

/* ------------------------------ actions --------------------------------- */
function requireUnlock(id,what){
  if(!state.unlocked[id]) err('LockedError',what+' is locked. Buy it in the Shop tab.');
}
const COST={move:1,harvest:1,plant:1,till:2,water:1,measure:1,swap:2,trade:2,flip:2,feed:1};

function* act(cost){ yield cost; }

function* a_move(args){
  let d=args.length?args[0]:null;
  if(d&&d.__sym&&d.kind==='Dir') d=d.v;
  if(typeof d!=='number'||d<0||d>3) err('TypeError','move() needs North, East, South or West');
  const D=world.drone;
  const nx=wrap(D.x+DV[d].x), ny=wrap(D.y+DV[d].y);
  D.dir=d;
  const dest=tileAt(nx,ny);
  yield COST.move;
  if(dest.e==='Hedge'){ D.bump=1; return false; }
  D.x=nx; D.y=ny;
  return true;
}
function* a_harvest(){
  const t=here();
  yield COST.harvest;
  if(!t.e) return false;
  if(t.e==='Hedge'){ t.e=null; t.age=0; return true; }
  if(!isMature(t)) return false;
  const D=world.drone;
  switch(t.e){
    case 'Grass':
      t.age=0;
      t.e = state.unlocked.plant ? null : 'Grass';   // wild grass regrows until you own a seed hopper
      give('Hay',1); fx(D.x,D.y,'+1','#D8B24A'); return true;
    case 'Bush':    t.e=null;t.age=0; give('Wood',1); fx(D.x,D.y,'+1','#8A5A33'); return true;
    case 'Carrot':  t.e=null;t.age=0; give('Carrot',1); fx(D.x,D.y,'+1','#E1762F'); return true;
    case 'Pumpkin': {
      const group=floodPumpkin(D.x,D.y);
      const n=group.length, side=Math.round(Math.sqrt(n));
      const amount = side*side===n ? n*side : n;
      for(const i of group){ world.tiles[i].e=null; world.tiles[i].age=0; }
      give('Pumpkin',amount); fx(D.x,D.y,'+'+amount,'#E08A2B'); return true;
    }
    case 'Sunflower': {
      let best=0;
      for(const t2 of world.tiles) if(t2.e==='Sunflower'&&isMature(t2)) best=Math.max(best,t2.d.petals);
      const p=t.d.petals;
      t.e=null; t.age=0;
      if(p>=best){ const gain=p*2; give('Power',gain); fx(D.x,D.y,'+'+gain,'#57B6C7'); return true; }
      fx(D.x,D.y,'wilt','#D4573A'); return false;
    }
    case 'Cactus': {
      const list=[];
      for(let y=0;y<world.size;y++) for(let k=0;k<world.size;k++){
        const x = y%2===0 ? k : world.size-1-k;
        const c=tileAt(x,y); if(c.e==='Cactus') list.push(c);
      }
      const allRipe=list.every(isMature);
      let sorted=true;
      for(let i=1;i<list.length;i++) if(list[i].d.size<list[i-1].d.size) sorted=false;
      if(allRipe&&sorted){
        const n=list.length;
        for(const c of list){ c.e=null; c.age=0; c.d=null; }
        give('Cactus',n); fx(D.x,D.y,'+'+n,'#5FA05A'); return true;
      }
      t.e=null;t.age=0;t.d=null; fx(D.x,D.y,'unsorted','#D4573A'); return false;
    }
    case 'Dinosaur': t.e=null;t.age=0;t.d=null; give('Bone',6); fx(D.x,D.y,'+6','#DCD2BE'); return true;
    case 'Treasure': {
      t.e=null;t.age=0; give('Gold',1); fx(D.x,D.y,'+1 gold','#F0C852');
      state.treasures++;
      if(state.treasures%5===0) buildMaze(); else placeTreasure();

}
function floodPumpkin(x,y){
  const seen=new Set(), out=[], st=[[wrap(x),wrap(y)]];
  while(st.length){
    const [cx,cy]=st.pop();
    const i=cy*world.size+cx;
    if(seen.has(i)) continue;
    const t=world.tiles[i];
    if(!t||t.e!=='Pumpkin'||!isMature(t)) continue;
    seen.add(i); out.push(i);
    for(const d of DV) st.push([wrap(cx+d.x),wrap(cy+d.y)]);

  return out;
}
function* a_plant(args){
  let e=args[0];
  if(!e||!e.__sym||e.kind!=='Entities') err('TypeError','plant() needs an Entities value, e.g. Entities.Grass');
  const name=e.name, sp=SPEC[name];
  requireUnlock(sp.need, name);
  if(name==='Treasure') err('ValueError','you cannot plant treasure');
  const t=here();
  yield COST.plant;
  if(name==='Hedge'){ buildMaze(); return true; }
  if(t.e) return false;
  if(t.g!==sp.ground) return false;
  t.e=name; t.age=0;
  if(name==='Sunflower') t.d={petals:1+Math.floor(Math.random()*7)};
  else if(name==='Cactus') t.d={size:1+Math.floor(Math.random()*9)};
  else if(name==='Dinosaur') t.d={fed:0,want:FEED_ITEMS[Math.floor(Math.random()*FEED_ITEMS.length)]};
  else t.d=null;
  return true;
}
function* a_till(){
  requireUnlock('till','till()');
  const t=here();
  yield COST.till;
  if(t.e) return false;
  t.g = t.g==='Soil' ? 'Grassland' : 'Soil';
  if(t.g==='Grassland') t.water=0;
  return true;
}
function* a_use_item(args){
  const it=args[0];
  if(!it||!it.__sym||it.kind!=='Items') err('TypeError','use_item() needs an Items value');
  const t=here(), D=world.drone;
  if(it.name==='Water'){
    requireUnlock('water','use_item(Items.Water)');
    yield COST.water;
    if(t.g!=='Soil') return false;
    t.water=1; fx(D.x,D.y,'water','#57B6C7'); return true;
  }
  if(it.name==='Fertilizer'){
    requireUnlock('fertilizer','fertilizer');
    yield COST.water;
    if(!t.e||!SPEC[t.e].grow) return false;
    if(state.items.Fertilizer<1) return false;
    state.items.Fertilizer--; UI.bump('Fertilizer');
    t.age=SPEC[t.e].grow; fx(D.x,D.y,'grown','#9B7BD4'); return true;
  }
  yield COST.feed;
  if(t.e==='Dinosaur'){
    if(t.d.want!==it.name) return false;
    if((state.items[it.name]||0)<1) return false;
    state.items[it.name]--; UI.bump(it.name);
    t.d.fed++;
    t.d.want=FEED_ITEMS[Math.floor(Math.random()*FEED_ITEMS.length)];
    fx(D.x,D.y,'fed '+t.d.fed+'/5','#8FC93A');

  }
  return false;
}
function* a_measure(args){
  requireUnlock('sensors','measure()');
  let t=here();
  if(args.length){
    let d=args[0]; if(d&&d.__sym&&d.kind==='Dir') d=d.v;
    t=tileAt(world.drone.x+DV[d].x, world.drone.y+DV[d].y);
  }
  yield COST.measure;
  if(!t.e) return null;
  if(t.e==='Sunflower') return t.d.petals;
  if(t.e==='Cactus') return t.d.size;

}
function* a_swap(args){
  requireUnlock('cactus','swap()');
  let d=args[0]; if(d&&d.__sym&&d.kind==='Dir') d=d.v;
  if(typeof d!=='number') err('TypeError','swap() needs a direction');
  const a=here(), b=tileAt(world.drone.x+DV[d].x, world.drone.y+DV[d].y);
  yield COST.swap;
  if(a.g!==b.g) return false;
  const e=a.e,ag=a.age,dd=a.d;
  a.e=b.e; a.age=b.age; a.d=b.d;
  b.e=e; b.age=ag; b.d=dd;
  return true;
}
function* a_trade(args){
  requireUnlock('trade','trade()');
  const it=args[0];
  const n=args.length>1?Math.trunc(numOf(args[1],'trade')):1;
  if(!it||!it.__sym||it.kind!=='Items') err('TypeError','trade() needs an Items value');
  const v=TRADE_VALUE[it.name];
  yield COST.trade;
  if(!v) return false;
  if(n<1||(state.items[it.name]||0)<n) return false;
  state.items[it.name]-=n; UI.bump(it.name);
  const mult = state.wanted===it.name?3:1;
  state.credit += n*v*mult;
  const gold=Math.floor(state.credit/100);
  if(gold>0){ state.credit-=gold*100; give('Gold',gold); fx(world.drone.x,world.drone.y,'+'+gold+'g','#F0C852'); }
  return true;
}
function* a_flip(){
  yield COST.flip;
  world.drone.flip=1;
  return true;
}

/* -------------------------------- maze ---------------------------------- */
function buildMaze(){
  requireUnlock('maze','the hedge maze');
  const n=world.size;
  if(n<5) err('ValueError','the maze needs a farm of at least 5x5');
  for(const t of world.tiles){ t.e='Hedge'; t.age=0; t.g='Grassland'; t.d=null; t.water=0; }
  const set=(x,y)=>{ if(x>=0&&y>=0&&x<n&&y<n) world.tiles[y*n+x].e=null; };
  const seen=new Set(), stack=[[0,0]];
  seen.add('0,0'); set(0,0);
  while(stack.length){
    const [x,y]=stack[stack.length-1];
    const opts=[];
    for(const d of DV){
      const nx=x+d.x*2, ny=y+d.y*2;
      if(nx>=0&&ny>=0&&nx<n&&ny<n&&!seen.has(nx+','+ny)) opts.push([nx,ny,x+d.x,y+d.y]);
    }
    if(!opts.length){ stack.pop(); continue; }
    const [nx,ny,mx,my]=opts[Math.floor(Math.random()*opts.length)];
    seen.add(nx+','+ny); set(mx,my); set(nx,ny); stack.push([nx,ny]);
  }
  for(let i=0;i<n;i++){
    const x=Math.floor(Math.random()*n), y=Math.floor(Math.random()*n);
    if(x>0&&y>0&&x<n-1&&y<n-1) set(x,y);
  }
  world.maze=true;
  world.drone.x=0; world.drone.y=0;
  placeTreasure();
}
function placeTreasure(){
  const open=[];
  for(let y=0;y<world.size;y++) for(let x=0;x<world.size;x++){
    const t=tileAt(x,y);
    if(!t.e && (x!==world.drone.x||y!==world.drone.y)) open.push([x,y,Math.abs(x-world.drone.x)+Math.abs(y-world.drone.y)]);
  }
  if(!open.length) return;
  open.sort((a,b)=>b[2]-a[2]);
  const pick=open[Math.floor(Math.random()*Math.max(1,Math.floor(open.length/3)))];
  tileAt(pick[0],pick[1]).e='Treasure';
}

function* B_minmax(a,kw,big){

const runner={ gen:null, running:false, carry:0, scope:null, source:'' };
