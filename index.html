    UI.flag('error'); return false;
  }
  const sc=new Scope(null,GLOBALS);
  sc.v=GLOBALS;
  RT={line:0,depth:0,last:null};
  runner.scope=sc;
  runner.carry=0;
  runner.gen=(function*(){ yield* execBlock(ast.body,sc); })();
  runner.running=true;
  UI.flag('running');
  UI.setRunning(true);
  UI.log('▶ run '+label,'s');
  return true;
}
function stopRun(quiet){
  runner.running=false; runner.gen=null;
  UI.setRunning(false); UI.flag('idle');
  if(!quiet) UI.log('■ stopped','i');
}
function programError(e){
  runner.running=false; runner.gen=null;
  UI.setRunning(false); UI.flag('error');
  if(e instanceof PyEx) UI.log(e.type+': '+e.msg+'   (line '+RT.line+')','e');
  else if(e instanceof Ret) UI.log('SyntaxError: return outside function','e');
  else if(e===BRK||e===CNT) UI.log('SyntaxError: break/continue outside loop','e');
  else UI.log('InternalError: '+(e&&e.message?e.message:String(e))+'   (line '+RT.line+')','e');
}
function stepProgram(dt){
  let budget = tpsNow()*dt + runner.carry;
  const cap = 30000;
  let ops=0;
  while(budget>0 && ops<cap && runner.running){
    let r;
    try{ r=runner.gen.next(); }
    catch(e){ programError(e); return; }
    if(r.done){
      runner.running=false; runner.gen=null;
      UI.setRunning(false); UI.flag('done');
      UI.log('✔ finished','s');
      UI.refreshShop();
      return;
    }
    const cost=r.value||0;
    if(cost>0){ advanceWorld(cost); budget-=cost; }
    ops++;
  }
  runner.carry=Math.max(-4,Math.min(0,budget));
  UI.refreshStats();
}
</script>
<script>
/* ============================== rendering ================================ */
const cv=document.getElementById('field');
const cx=cv.getContext('2d');
let CW=0,CH=0,DPR=1;

function resizeCanvas(){
  const r=cv.getBoundingClientRect();
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  CW=Math.max(80,Math.round(r.width)); CH=Math.max(80,Math.round(r.height));
  cv.width=Math.round(CW*DPR); cv.height=Math.round(CH*DPR);
  cx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(resizeCanvas).observe(cv);

const hash=(x,y)=>{ const s=Math.sin(x*127.1+y*311.7)*43758.5453; return s-Math.floor(s); };
const lerp=(a,b,t)=>a+(b-a)*t;
function rr(g,x,y,w,h,r){
  g.beginPath();
  const k=Math.min(r,w/2,h/2);
  g.moveTo(x+k,y); g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
  g.arcTo(x,y+h,x,y,k); g.arcTo(x,y,x+w,y,k); g.closePath();
}

let spin=0;
function draw(dt){
  spin+=dt*18;
  const n=world.size;
  const pad=6;
  const cell=Math.floor(Math.min((CW-pad*2)/n,(CH-pad*2)/n));
  const ox=Math.round((CW-cell*n)/2), oy=Math.round((CH-cell*n)/2);
  cx.clearRect(0,0,CW,CH);
  cx.fillStyle='#100D0C'; cx.fillRect(0,0,CW,CH);

  const px=(x)=>ox+x*cell;
  const py=(y)=>oy+(n-1-y)*cell;

  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const t=world.tiles[y*n+x];
    const X=px(x), Y=py(y), h=hash(x,y);
    if(t.g==='Soil'){
      const w=t.water;
      const base=[lerp(74,44,w),lerp(53,32,w),lerp(38,24,w)];
      cx.fillStyle='rgb('+Math.round(base[0]+h*10)+','+Math.round(base[1]+h*8)+','+Math.round(base[2]+h*6)+')';
      cx.fillRect(X,Y,cell,cell);
      if(w>0.02){
        cx.fillStyle='rgba(87,182,199,'+(0.10*w).toFixed(3)+')';
        cx.fillRect(X,Y,cell,cell);
      }
      cx.fillStyle='rgba(0,0,0,.16)';
      for(let i=0;i<3;i++){
        const hx=hash(x*3+i,y*7), hy=hash(x*5,y*11+i);
        cx.fillRect(X+hx*(cell-3),Y+hy*(cell-3),cell*0.16,1.5);
      }
    }else{
      const g1=48+h*14;
      cx.fillStyle='rgb('+Math.round(38+h*10)+','+Math.round(g1)+','+Math.round(26+h*8)+')';
      cx.fillRect(X,Y,cell,cell);
      cx.strokeStyle='rgba(143,201,58,.10)'; cx.lineWidth=1;
      cx.beginPath();
      for(let i=0;i<2;i++){
        const hx=X+hash(x+i*9,y)*cell*0.8+cell*0.1, hy=Y+hash(x,y+i*4)*cell*0.8+cell*0.1;
        cx.moveTo(hx,hy+cell*0.12); cx.lineTo(hx+cell*0.04,hy);
      }
      cx.stroke();
    }
    cx.strokeStyle='rgba(0,0,0,.22)'; cx.lineWidth=1;
    cx.strokeRect(X+0.5,Y+0.5,cell-1,cell-1);
    if(t.e) drawEntity(t,X,Y,cell,x,y);
  }

  // harvest-ready markers
  cx.lineWidth=Math.max(1,cell*0.045);
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const t=world.tiles[y*n+x];
    if(t.e&&t.e!=='Hedge'&&isMature(t)){
      cx.strokeStyle='rgba(233,162,59,.55)';
      const X=px(x),Y=py(y), m=cell*0.12;
      cx.beginPath();
      cx.moveTo(X+m,Y+m*1.9); cx.lineTo(X+m,Y+m); cx.lineTo(X+m*1.9,Y+m);
      cx.moveTo(X+cell-m,Y+cell-m*1.9); cx.lineTo(X+cell-m,Y+cell-m); cx.lineTo(X+cell-m*1.9,Y+cell-m);
      cx.stroke();
    }
  }

  // drone
  const D=world.drone;
  const k=Math.min(1,dt*Math.max(8,tpsNow()*0.9));
  let tx=D.x, ty=D.y;
  if(Math.abs(D.vx-tx)>n/2) D.vx += (D.vx>tx? -n : n);
  if(Math.abs(D.vy-ty)>n/2) D.vy += (D.vy>ty? -n : n);
  D.vx=lerp(D.vx,tx,k); D.vy=lerp(D.vy,ty,k);
  if(D.flip>0) D.flip=Math.max(0,D.flip-dt*2.6);
  if(D.bump>0) D.bump=Math.max(0,D.bump-dt*4);
  const dx=px(D.vx)+cell/2, dy=py(D.vy)+cell/2;
  drawDrone(dx,dy,cell,D);

  // floating text
  for(let i=world.fx.length-1;i>=0;i--){
    const f=world.fx[i];
    f.t+=dt;
    if(f.t>1.1){ world.fx.splice(i,1); continue; }
    const a=1-f.t/1.1;
    cx.globalAlpha=a;
    cx.fillStyle=f.color;
    cx.font='600 '+Math.max(9,Math.round(cell*0.32))+'px Chakra Petch, sans-serif';
    cx.textAlign='center';
    cx.fillText(f.text, px(f.x)+cell/2, py(f.y)+cell*0.4-f.t*cell*0.5);
    cx.globalAlpha=1;
  }
  cx.textAlign='left';
}

function drawEntity(t,X,Y,c,gx,gy){
  const sp=SPEC[t.e];
  const p=sp.grow>0?Math.min(1,t.age/sp.grow):1;
  const cxm=X+c/2, cym=Y+c/2;
  switch(t.e){
    case 'Grass':{
      const hgt=c*(0.18+0.42*p);
      cx.strokeStyle=p>=1?'#D8B24A':'#6FA33A';
      cx.lineWidth=Math.max(1,c*0.07); cx.lineCap='round';
      cx.beginPath();
      for(let i=-1;i<=1;i++){
        cx.moveTo(cxm+i*c*0.17,Y+c*0.82);
        cx.quadraticCurveTo(cxm+i*c*0.22,Y+c*0.82-hgt*0.6,cxm+i*c*0.3,Y+c*0.82-hgt);
      }
      cx.stroke(); cx.lineCap='butt';
      break;
    }
    case 'Bush':{
      const r=c*(0.16+0.22*p);
      cx.fillStyle=p>=1?'#4E7A2E':'#3E6327';
      cx.beginPath();
      cx.arc(cxm-r*0.5,cym+r*0.2,r*0.75,0,7); cx.arc(cxm+r*0.5,cym+r*0.2,r*0.75,0,7);
      cx.arc(cxm,cym-r*0.35,r*0.85,0,7); cx.fill();
      if(p>=1){ cx.fillStyle='#8A5A33';
        for(let i=0;i<3;i++){ cx.beginPath();
          cx.arc(cxm+(i-1)*r*0.6,cym+(i%2?r*0.1:-r*0.25),r*0.2,0,7); cx.fill(); } }
      break;
    }
    case 'Carrot':{
      cx.strokeStyle='#5F9B34'; cx.lineWidth=Math.max(1,c*0.06);
      cx.beginPath();
      for(let i=-1;i<=1;i++){ cx.moveTo(cxm,Y+c*0.62);
        cx.lineTo(cxm+i*c*0.2,Y+c*0.62-c*(0.12+0.24*p)); }
      cx.stroke();
      if(p>=1){ cx.fillStyle='#E1762F'; cx.beginPath();
        cx.moveTo(cxm-c*0.13,Y+c*0.6); cx.lineTo(cxm+c*0.13,Y+c*0.6);
        cx.lineTo(cxm,Y+c*0.84); cx.closePath(); cx.fill(); }
      break;
    }
    case 'Pumpkin':{
      const r=c*(0.14+0.32*p);
      cx.fillStyle=p>=1?'#E08A2B':'#7D8B36';
      cx.beginPath(); cx.ellipse(cxm,cym+c*0.04,r,r*0.86,0,0,7); cx.fill();
      cx.strokeStyle='rgba(0,0,0,.22)'; cx.lineWidth=Math.max(1,c*0.03);
      cx.beginPath();
      cx.ellipse(cxm,cym+c*0.04,r*0.35,r*0.85,0,0,7);
      cx.stroke();
      cx.fillStyle='#4E6B22'; cx.fillRect(cxm-c*0.03,cym-r*0.95,c*0.06,c*0.09);
      break;
    }
    case 'Sunflower':{
      const st=c*(0.2+0.4*p);
      cx.strokeStyle='#4E7A2E'; cx.lineWidth=Math.max(1,c*0.05);
      cx.beginPath(); cx.moveTo(cxm,Y+c*0.86); cx.lineTo(cxm,Y+c*0.86-st); cx.stroke();
      const hy=Y+c*0.86-st, r=c*(0.09+0.11*p);
      if(p>=1){
        cx.fillStyle='#EFC544';
        for(let i=0;i<t.d.petals;i++){
          const a=i/t.d.petals*Math.PI*2;
          cx.beginPath();
          cx.ellipse(cxm+Math.cos(a)*r*1.25,hy+Math.sin(a)*r*1.25,r*0.7,r*0.34,a,0,7);
          cx.fill();
        }
      }
      cx.fillStyle=p>=1?'#6B4A22':'#5C7A31';
      cx.beginPath(); cx.arc(cxm,hy,r,0,7); cx.fill();
      if(p>=1&&c>26){
        cx.fillStyle='#FFF3D6'; cx.font='700 '+Math.round(c*0.26)+'px JetBrains Mono, monospace';
        cx.textAlign='center'; cx.fillText(String(t.d.petals),cxm,Y+c*0.99); cx.textAlign='left';
      }
      break;
    }
    case 'Cactus':{
      const s=t.d?t.d.size:1;
      const hgt=c*(0.2+0.06*s)*(0.45+0.55*p);
      const w=c*0.19;
      cx.fillStyle=p>=1?'#5FA05A':'#41763F';
      rr(cx,cxm-w/2,Y+c*0.84-hgt,w,hgt,w*0.45); cx.fill();
      if(s>3){ rr(cx,cxm-w*1.5,Y+c*0.84-hgt*0.62,w*0.8,hgt*0.42,w*0.35); cx.fill(); }
      if(s>6){ rr(cx,cxm+w*0.7,Y+c*0.84-hgt*0.75,w*0.8,hgt*0.5,w*0.35); cx.fill(); }
      if(c>26){
        cx.fillStyle='rgba(255,243,214,.85)'; cx.font='700 '+Math.round(c*0.24)+'px JetBrains Mono, monospace';
        cx.textAlign='center'; cx.fillText(String(s),cxm,Y+c*0.99); cx.textAlign='left';
      }
      break;
    }
    case 'Dinosaur':{
      const f=t.d?t.d.fed:0, sc=0.6+0.09*f;
      cx.fillStyle=isMature(t)?'#7FB25A':'#5E8C46';
      const bw=c*0.4*sc, bh=c*0.26*sc, bx=cxm-bw*0.4, by=cym+c*0.08;
      rr(cx,bx-bw/2,by-bh,bw,bh,bh*0.45); cx.fill();
      cx.beginPath(); cx.arc(bx+bw*0.55,by-bh*1.25,bh*0.55,0,7); cx.fill();
      cx.beginPath(); cx.moveTo(bx-bw*0.5,by-bh*0.6);
      cx.lineTo(bx-bw*1.05,by-bh*1.1); cx.lineTo(bx-bw*0.5,by-bh*0.1); cx.fill();
      cx.fillRect(bx-bw*0.3,by-2,bw*0.16,bh*0.5); cx.fillRect(bx+bw*0.15,by-2,bw*0.16,bh*0.5);
      cx.fillStyle='#120E0C'; cx.beginPath(); cx.arc(bx+bw*0.72,by-bh*1.32,bh*0.12,0,7); cx.fill();
      if(!isMature(t)&&t.d){
        cx.fillStyle=ITEM_COLOR[t.d.want];
        cx.beginPath(); cx.arc(X+c*0.82,Y+c*0.2,c*0.075,0,7); cx.fill();
        cx.fillStyle='rgba(255,255,255,.55)';
        for(let i=0;i<5;i++) cx.fillRect(X+c*0.16+i*c*0.13,Y+c*0.13,c*0.09,i<f?c*0.05:c*0.02);
      }
      break;
    }
    case 'Hedge':{
      cx.fillStyle='#24361B';
      rr(cx,X+1,Y+1,c-2,c-2,Math.max(2,c*0.14)); cx.fill();
      cx.fillStyle='rgba(143,201,58,.10)';
      for(let i=0;i<4;i++){
        const hx=hash(gx*7+i,gy*3), hy=hash(gx,gy*5+i);
        cx.beginPath(); cx.arc(X+c*0.2+hx*c*0.6,Y+c*0.2+hy*c*0.6,c*0.11,0,7); cx.fill();
      }
      break;
    }
    case 'Treasure':{
      const g=0.6+0.4*Math.sin(spin*0.35);
      cx.fillStyle='rgba(240,200,82,'+(0.14*g).toFixed(3)+')';
      cx.beginPath(); cx.arc(cxm,cym,c*0.5,0,7); cx.fill();
      cx.fillStyle='#7A5220'; rr(cx,cxm-c*0.26,cym-c*0.14,c*0.52,c*0.3,c*0.05); cx.fill();
      cx.fillStyle='#A66E2A'; rr(cx,cxm-c*0.26,cym-c*0.28,c*0.52,c*0.18,c*0.07); cx.fill();
      cx.fillStyle='#F0C852'; cx.fillRect(cxm-c*0.05,cym-c*0.2,c*0.1,c*0.22);
      break;
    }
  }
}

function drawDrone(x,y,c,D){
  const s=c*0.62;
  cx.save();
  cx.translate(x,y);
  cx.fillStyle='rgba(0,0,0,.35)';
  cx.beginPath(); cx.ellipse(0,s*0.55,s*0.42,s*0.14,0,0,7); cx.fill();
  if(D.flip>0) cx.rotate((1-D.flip)*Math.PI*2);
  if(D.bump>0) cx.translate(DV[D.dir].x*D.bump*c*0.12, -DV[D.dir].y*D.bump*c*0.12);
  const arm=s*0.36;
  cx.strokeStyle='#4A3E35'; cx.lineWidth=Math.max(1.4,s*0.09);
  cx.beginPath();
  cx.moveTo(-arm,-arm); cx.lineTo(arm,arm); cx.moveTo(arm,-arm); cx.lineTo(-arm,arm);
  cx.stroke();
  for(const [ax,ay] of [[-arm,-arm],[arm,-arm],[-arm,arm],[arm,arm]]){
    cx.strokeStyle='rgba(87,182,199,.65)'; cx.lineWidth=Math.max(1,s*0.05);
    cx.beginPath(); cx.arc(ax,ay,s*0.2,spin%6.28,spin%6.28+3.6); cx.stroke();
    cx.fillStyle='#2A2320'; cx.beginPath(); cx.arc(ax,ay,s*0.07,0,7); cx.fill();
  }
  cx.fillStyle='#1F1A17';
  rr(cx,-s*0.28,-s*0.24,s*0.56,s*0.48,s*0.14); cx.fill();
  cx.strokeStyle='#8FC93A'; cx.lineWidth=Math.max(1,s*0.045);
  rr(cx,-s*0.28,-s*0.24,s*0.56,s*0.48,s*0.14); cx.stroke();
  const d=DV[D.dir];
  cx.fillStyle='#E9A23B';
  cx.beginPath(); cx.arc(d.x*s*0.2,-d.y*s*0.2,s*0.09,0,7); cx.fill();
  cx.restore();
}
</script>
<script>
/* =============================== upgrades =============================== */
const EXPAND_COST=[null,{Hay:20},{Hay:120},{Wood:100},{Wood:450},{Carrot:500},
  {Pumpkin:400},{Power:900},{Cactus:700},{Bone:900},{Gold:30}];
const SPEED_COST=[null,{Hay:30},{Hay:150},{Wood:120},{Wood:500},{Carrot:400},{Carrot:1200},
  {Power:200},{Power:800},{Power:2500},{Bone:600},{Gold:12},{Gold:45}];

const UPGRADES=[
  {id:'sensors',cat:'Systems',name:'Sensor Array',req:[],cost:()=>({Hay:2}),
   desc:'can_harvest(), get_entity_type(), get_ground_type() and measure().'},
  {id:'plant',cat:'Crops',name:'Seed Hopper',req:[],cost:()=>({Hay:5}),
   desc:'plant(Entities.Grass) — grass regrows into hay in 3 ticks.'},
  {id:'expand',cat:'Systems',name:'Field Expansion',req:[],lvl:()=>[state.expand,EXPAND_COST.length-1],
   cost:s=>EXPAND_COST[s.expand+1]||{}, dyn:()=>'Farm is '+world.size+'x'+world.size+
   (SIZES[state.expand+1]?' → '+SIZES[state.expand+1]+'x'+SIZES[state.expand+1]:' (max)'),
   desc:'More ground under the rotors.'},
  {id:'speed',cat:'Systems',name:'Rotor Tuning',req:[],lvl:()=>[state.speed,TPS.length-1],
   cost:s=>SPEED_COST[s.speed+1]||{}, dyn:()=>'Top speed '+TPS[state.speed]+' ticks/s'+
   (TPS[state.speed+1]?' → '+TPS[state.speed+1]:' (max)'),
   desc:'Raises the speed cap on the run bar.'},
  {id:'bush',cat:'Crops',name:'Bushes',req:['plant'],cost:()=>({Hay:60}),
   desc:'plant(Entities.Bush) → wood. Slower than grass, worth more.'},
  {id:'till',cat:'Crops',name:'Tiller',req:['bush'],cost:()=>({Wood:40}),
   desc:'till() flips a tile between grassland and soil.'},
  {id:'carrot',cat:'Crops',name:'Carrots',req:['till'],cost:()=>({Wood:120,Hay:200}),
   desc:'plant(Entities.Carrot) on soil. Soil grows slowly while dry.'},
  {id:'water',cat:'Crops',name:'Irrigation',req:['carrot'],cost:()=>({Carrot:150}),
   desc:'get_water() and use_item(Items.Water). Wet soil grows ~3x faster.'},
  {id:'trade',cat:'Market',name:'Trading Post',req:['carrot'],cost:()=>({Wood:250,Carrot:100}),
   desc:'trade(item, n) sells goods for gold. get_trade_request() names the item paying triple.'},
  {id:'pumpkin',cat:'Crops',name:'Pumpkins',req:['water'],cost:()=>({Carrot:400}),
   desc:'Ripe pumpkins touching each other merge — an n x n block pays n^3.'},
  {id:'sunflower',cat:'Crops',name:'Sunflowers',req:['pumpkin'],cost:()=>({Pumpkin:250}),
   desc:'measure() reads petals. Only the most-petalled ripe flower yields power.'},
  {id:'cactus',cat:'Crops',name:'Cacti',req:['sunflower'],cost:()=>({Power:400}),
   desc:'swap(dir) trades two plants. Cacti only pay out once the whole field is sorted by size.'},
  {id:'dino',cat:'Livestock',name:'Dinosaurs',req:['cactus'],cost:()=>({Cactus:300,Pumpkin:800}),
   desc:'measure() asks what it wants; use_item() feeds it. Five feeds → 6 bones.'},
  {id:'maze',cat:'Livestock',name:'Hedge Maze',req:['dino'],cost:()=>({Bone:400}),
   desc:'plant(Entities.Hedge) rebuilds the farm as a maze. Find the chest for gold.'},
  {id:'fertilizer',cat:'Market',name:'Fertilizer',req:['maze'],cost:()=>({Gold:15}),
   desc:'Buy fertilizer with gold; use_item(Items.Fertilizer) ripens a plant instantly.'}
];
for(const u of UPGRADES) Unlocks.props[u.id]=sym('Unlocks',u.id);

function canAfford(c){ for(const k in c) if((state.items[k]||0)<c[k]) return false; return true; }
function pay(c){ for(const k in c){ state.items[k]-=c[k]; UI.bump(k); } }
function reqsMet(u){ return u.req.every(r=>state.unlocked[r]); }
function isOwned(u){ return u.lvl ? false : !!state.unlocked[u.id]; }
function isMaxed(u){ if(!u.lvl) return false; const [c,m]=u.lvl(); return c>=m; }

function buy(u){
  if(isOwned(u)||isMaxed(u)||!reqsMet(u)) return;
  const c=u.cost(state);
  if(!canAfford(c)){ UI.log('not enough resources for '+u.name,'e'); return; }
  pay(c);
  if(u.id==='expand'){ state.expand++; buildWorld(SIZES[state.expand],true); }
  else if(u.id==='speed'){ state.speed++; state.speedPref=state.speed; UI.syncSpeed(); }
  else state.unlocked[u.id]=true;
  UI.log('unlocked '+u.name,'s');
  UI.refreshShop(); UI.refreshStats(); save();
}

/* ================================= UI =================================== */
const $=id=>document.getElementById(id);
const STARTER='# Rootloop \u2014 press Run.\n'+
  '# Wild grass regrows by itself until you buy the Seed Hopper.\n\n'+
  'while True:\n'+
  '    harvest()\n'+
  '    move(North)\n';

let files=[{name:'main.py',code:STARTER}];
let active=0;
let logLines=[];

const UI={
  statsAt:0, bumped:{},
  bump(item){ this.bumped[item]=performance.now(); this.statsAt=0; },
  log(text,cls,quick){
    if(quick && logLines.length && logLines[logLines.length-1].q) logLines[logLines.length-1]={t:text,c:cls,q:1};
    else logLines.push({t:text,c:cls,q:quick?1:0});
    if(logLines.length>300) logLines.splice(0,logLines.length-300);
    this.renderLog();
  },
  clearLog(){ logLines=[]; this.renderLog(); },
  renderLog(){
    const el=$('log');
    el.innerHTML=logLines.map(l=>'<div class="'+(l.c||'')+'">'+esc(l.t)+'</div>').join('');
    el.scrollTop=el.scrollHeight;
  },
  flag(mode){
    const f=$('flag');
    f.className='flag'+(mode==='running'?' on':mode==='error'?' err':'');
    f.textContent=mode;
  },
  setRunning(on){ $('runBtn').disabled=on; $('stopBtn').disabled=!on; },
  syncSpeed(){
    const s=$('speed');
    s.max=String(state.speed);
    state.speedPref=Math.min(state.speedPref,state.speed);
    s.value=String(state.speedPref);
    $('tps').textContent=TPS[state.speedPref]+'/s';
  },
  refreshStats(force){
    const now=performance.now();
    if(!force && now-this.statsAt<120) return;
    this.statsAt=now;
    const shown=ITEMS.filter(i=>state.items[i]>0||['Hay'].includes(i)||
      (i==='Wood'&&state.unlocked.bush)||(i==='Carrot'&&state.unlocked.carrot)||
      (i==='Fertilizer'&&state.unlocked.fertilizer));
    $('strip').innerHTML=shown.map(i=>{
      const hot=now-(this.bumped[i]||0)<400;
      return '<span class="chip'+(hot?' pulse':'')+'"><span class="dot" style="background:'+ITEM_COLOR[i]+'"></span>'+
        i.toLowerCase()+' <b>'+fmtInt(state.items[i]||0)+'</b></span>';
    }).join('');
    const n=UPGRADES.filter(u=>reqsMet(u)&&!isOwned(u)&&!isMaxed(u)&&canAfford(u.cost(state))).length;
    const b=$('shopBadge');
    if(n>0){ b.hidden=false; b.textContent=String(n); } else b.hidden=true;
  },
  refreshShop(){
    const cats=['Systems','Crops','Livestock','Market'];
    let html='';
    for(const c of cats){
      const list=UPGRADES.filter(u=>u.cat===c);
      if(!list.length) continue;
      html+='<div class="secTitle">'+c+'</div><div class="buys">';
      for(const u of list){
        const met=reqsMet(u), owned=isOwned(u), maxed=isMaxed(u);
        const cost=u.cost(state), afford=canAfford(cost);
        const lvl=u.lvl?u.lvl():null;
        html+='<div class="buy'+(owned||maxed?' owned':met?'':' locked')+'">';
        html+='<h3>'+u.name+(lvl?' <span class="lvl">lv '+lvl[0]+'/'+lvl[1]+'</span>':'')+'</h3>';
        html+= owned||maxed
          ? '<button class="btn small" disabled>'+(maxed?'max':'owned')+'</button>'
          : '<button class="btn small'+(met&&afford?' primary':'')+'" data-buy="'+u.id+'"'+
            (met&&afford?'':' disabled')+'>'+(met?'unlock':'locked')+'</button>';
        html+='<p>'+esc(u.dyn?u.dyn()+' — '+u.desc:u.desc)+'</p>';
        if(!(owned||maxed)){
          html+='<div class="price">';
          if(!met) html+='<span class="tag short">needs '+u.req.map(r=>nameOf(r)).join(' + ')+'</span>';
          for(const k in cost)
            html+='<span class="tag'+((state.items[k]||0)<cost[k]?' short':'')+'">'+fmtInt(cost[k])+' '+k.toLowerCase()+'</span>';
          html+='</div>';
        }
        html+='</div>';
      }
      html+='</div>';
    }
    html+='<div class="secTitle">Supplies</div><div class="buys">'+
      '<div class="buy'+(state.unlocked.fertilizer?'':' locked')+'"><h3>Fertilizer x10</h3>'+
      '<button class="btn small'+(state.unlocked.fertilizer&&state.items.Gold>=2?' primary':'')+'" data-act="fert"'+
      (state.unlocked.fertilizer&&state.items.Gold>=2?'':' disabled')+'>buy</button>'+
      '<p>Ten doses of instant ripening.</p><div class="price"><span class="tag'+
      (state.items.Gold<2?' short':'')+'">2 gold</span></div></div>'+
      '<div class="buy"><h3>Clear the field</h3>'+
      '<button class="btn small" data-act="clear">reset</button>'+
      '<p>Wipes every plant back to bare grassland. The way out of a finished maze.</p></div>'+
      '<div class="buy"><h3>Wipe save</h3>'+
      '<button class="btn small" data-act="wipe">erase</button>'+
      '<p>Deletes progress and code on this device. No undo.</p></div></div>';
    $('shop').innerHTML=html;
  }
};
function nameOf(id){ const u=UPGRADES.find(x=>x.id===id); return u?u.name:id; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtInt(n){ return n>=10000 ? (n/1000).toFixed(n>=100000?0:1)+'k' : String(Math.floor(n)); }

/* ---------------------------- editor ------------------------------------ */
const API_WORDS=['move','harvest','plant','till','use_item','measure','swap','trade','do_a_flip',
  'get_pos_x','get_pos_y','get_world_size','get_time','num_items','can_harvest','get_entity_type',
  'get_ground_type','get_water','get_trade_request','print','quick_print','clear','range','len','abs',
  'int','float','str','list','dict','set','sum','min','max','sorted','random','random_int','round',
  'enumerate','zip','reversed','any','all','map','filter','sqrt','floor','ceil','type','bool','tuple'];
const CONST_WORDS=['True','False','None','North','East','South','West','Items','Entities','Grounds'];
const KW_WORDS=['if','elif','else','while','for','in','def','return','break','continue','pass','and',
  'or','not','global','import','from','as','try','except','finally','raise','is','lambda','del','assert'];

const HL=new RegExp(
  '(#[^\\n]*)'+
  '|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\')'+
  '|\\b('+KW_WORDS.join('|')+')\\b'+
  '|\\b('+CONST_WORDS.join('|')+')\\b'+
  '|\\b('+API_WORDS.join('|')+')\\b(?=\\s*\\()'+
  '|\\b(\\d+\\.?\\d*)\\b','g');

function highlight(src){
  const out=esc(src).replace(HL,(m,com,str,kw,cst,api,num)=>{
    if(com) return '<span class="tk-com">'+com+'</span>';
    if(str) return '<span class="tk-str">'+str+'</span>';
    if(kw) return '<span class="tk-kw">'+kw+'</span>';
    if(cst) return '<span class="tk-const">'+cst+'</span>';
    if(api) return '<span class="tk-api">'+api+'</span>';
    if(num) return '<span class="tk-num">'+num+'</span>';
    return m;
  });
  return out+'\n\n';
}
function syncHL(){ $('hl').innerHTML=highlight($('code').value); }
function renderFiles(){
  $('files').innerHTML=files.map((f,i)=>
    '<button class="file'+(i===active?' active':'')+'" data-file="'+i+'">'+esc(f.name)+'</button>').join('')+
    '<button class="file" data-file="new">+ new</button>'+
    (files.length>1?'<button class="file" data-file="del">delete</button>':'');
}
function loadFile(i){
  active=i; $('code').value=files[i].code; syncHL(); renderFiles();
  $('hl').scrollTop=0; $('code').scrollTop=0;
}
function insert(text,caretBack){
  const ta=$('code'), s=ta.selectionStart, e=ta.selectionEnd;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  const p=s+text.length-(caretBack||0);
  ta.selectionStart=ta.selectionEnd=p;
  ta.focus(); onEdit();
}
function onEdit(){ files[active].code=$('code').value; syncHL(); saveSoon(); }

const KEYS=[['⇥','    '],[':',':'],['(','()',1],['[','[]',1],['"','""',1],['=','='],['==','=='],
  ['while True:','while True:\n    '],['if','if '],['else:','else:\n    '],['for','for i in range(10):\n    '],
  ['move','move(North)'],['N','North'],['E','East'],['S','South'],['W','West'],
  ['harvest','harvest()'],['plant','plant(Entities.Grass)'],['can_harvest','can_harvest()'],
  ['num_items','num_items(Items.Hay)'],['print','print()',1]];

/* ------------------------------ save/load -------------------------------- */
const KEY='rootloop.save.v1';
let saveTimer=null;
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,900); }
function save(){
  try{
    const t=world.tiles.map(x=>[x.g==='Soil'?1:0, x.e?ENT.indexOf(x.e):-1,
      Math.round(x.age*10)/10, Math.round(x.water*100)/100, x.d]);
    localStorage.setItem(KEY,JSON.stringify({
      v:1, items:state.items, unlocked:state.unlocked, expand:state.expand, speed:state.speed,
      speedPref:state.speedPref, credit:state.credit, treasures:state.treasures,
      files, active, size:world.size, time:world.time, maze:world.maze,
      drone:{x:world.drone.x,y:world.drone.y,dir:world.drone.dir}, tiles:t
    }));
  }catch(e){}
}
function load(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!d){ buildWorld(SIZES[0],false); return; }
  Object.assign(state.items,d.items||{});
  state.unlocked=d.unlocked||{};
  state.expand=d.expand||0; state.speed=d.speed||0;
  state.speedPref=Math.min(d.speedPref??d.speed??0,state.speed);
  state.credit=d.credit||0; state.treasures=d.treasures||0;
  buildWorld(d.size||SIZES[state.expand],false);
  if(d.tiles&&d.tiles.length===world.tiles.length){
    d.tiles.forEach((s,i)=>{ const t=world.tiles[i];
      t.g=s[0]?'Soil':'Grassland'; t.e=s[1]>=0?ENT[s[1]]:null; t.age=s[2]||0; t.water=s[3]||0; t.d=s[4]||null; });
  }
  world.time=d.time||0; world.maze=!!d.maze;
  if(d.drone){ world.drone.x=d.drone.x|0; world.drone.y=d.drone.y|0; world.drone.dir=d.drone.dir|0;
    world.drone.vx=world.drone.x; world.drone.vy=world.drone.y; }
  if(Array.isArray(d.files)&&d.files.length){ files=d.files; active=Math.min(d.active||0,files.length-1); }
}
function wipe(){
  if(!confirm('Erase all progress and code on this device?')) return;
  localStorage.removeItem(KEY);
  location.reload();
}
</script>
<script>
/* ============================== the guide ================================ */
function apiRow(sig,txt,lock){
  const off = lock && !state.unlocked[lock];
  return '<div class="row'+(off?' lk':'')+'"><code>'+esc(sig)+'</code><span>'+txt+
    (off?' <em>— locked</em>':'')+'</span></div>';
}
function renderGuide(){
  $('guide').innerHTML=`
<h2>What this is</h2>
<p>A farm, a drone, and a Python interpreter. You never move the drone by hand — you write a program,
press <b>Run</b>, and watch it work. Every action the drone takes costs a tick of farm time, so plants
only grow while your code is running. Faster code, faster farm.</p>
<p>Written from scratch as a personal tribute to the coding-farm genre: the language, the sim and the
art here are all original.</p>

<h2>Start here</h2>
<pre>while True:
    harvest()
    move(North)</pre>
<p>The farm wraps at the edges, so moving north forever walks one column round and round. Wild grass
regrows where you cut it, so that loop alone earns the hay for your first upgrades in the <b>Shop</b>.
Buy the <b>Seed Hopper</b> and you take over the replanting yourself:</p>
<pre>while True:
    for i in range(get_world_size()):
        for j in range(get_world_size()):
            harvest()
            plant(Entities.Grass)
            move(North)
        move(East)</pre>
<p>That walks the whole field, column by column, forever.</p>

<h2>Ticks and speed</h2>
<p>Moving, harvesting and planting cost 1 tick; tilling, swapping, trading and flips cost 2. Pure
computation is free. The run bar sets how many ticks pass per second — <b>Rotor Tuning</b> in the shop
raises the ceiling.</p>

<h2>Drone commands</h2>
<div class="api">
${apiRow('move(North)','Step one tile. Also East, South, West. Returns False if a hedge blocks it.')}
${apiRow('harvest()','Take whatever is ripe on this tile. Returns True if something was taken.')}
${apiRow('plant(Entities.Grass)','Plant on the current tile. Fails if the tile is occupied or the wrong ground.','plant')}
${apiRow('till()','Toggle this tile between grassland and soil.','till')}
${apiRow('use_item(Items.Water)','Water the soil under the drone.','water')}
${apiRow('use_item(Items.Carrot)','Feed the dinosaur standing here.','dino')}
${apiRow('measure()','Petals, cactus size, or what a dinosaur wants. measure(North) reads a neighbour.','sensors')}
${apiRow('swap(North)','Swap this plant with the neighbouring one.','cactus')}
${apiRow('trade(Items.Hay, 100)','Sell goods for gold.','trade')}
${apiRow('do_a_flip()','No yield whatsoever.')}
</div>

<h2>Sensors and counters</h2>
<div class="api">
${apiRow('get_pos_x() / get_pos_y()','Drone coordinates. (0, 0) is the bottom-left corner.')}
${apiRow('get_world_size()','Width of the square farm.')}
${apiRow('num_items(Items.Hay)','How much you are holding.')}
${apiRow('can_harvest()','True when this tile holds something ripe.','sensors')}
${apiRow('get_entity_type()','Entities.Grass, Entities.Treasure, … or None.','sensors')}
${apiRow('get_ground_type()','Grounds.Grassland or Grounds.Soil.','sensors')}
${apiRow('get_water()','Moisture here, 0.0 to 1.0.','water')}
${apiRow('get_trade_request()','The item the market is paying triple for.','trade')}
${apiRow('get_time()','Ticks elapsed on this farm.')}
${apiRow('print(x) / quick_print(x)','Write to the Log tab. quick_print overwrites its own line.')}
</div>

<h2>The crops</h2>
<p><b>Grass</b> → hay in 3 ticks. <b>Bushes</b> → wood, slower. Both need grassland.</p>
<p><b>Soil</b> crops grow at about a third speed while dry, so water pays for itself:</p>
<pre>if get_water() < 0.5:
    use_item(Items.Water)</pre>
<p><b>Pumpkins</b> merge: ripe pumpkins that touch become one field, and harvesting an n x n block
pays n<sup>3</sup> instead of n<sup>2</sup>. Plant the whole square, wait for the last one, then harvest once.</p>
<p><b>Sunflowers</b> carry 1–7 petals — <code>measure()</code> reads them. Only the ripe flowers holding
the highest petal count pay out; harvest anything less and it wilts for nothing. Scan first, then reap.</p>
<pre>best = 0
for i in range(n * n):
    p = measure()
    if p != None and p > best:
        best = p
    step()</pre>
<p><b>Cacti</b> only pay when every cactus is ripe <i>and</i> sorted by size along the snake path:
the bottom row left to right, the row above it right to left, and so on upward. Every step of that path
lands on a neighbouring tile, so a bubble sort with <code>swap(dir)</code> is enough. Harvest an unsorted
patch and that cactus is simply gone.</p>
<p><b>Dinosaurs</b> want a random item — <code>measure()</code> tells you which — and
<code>use_item()</code> hands it over. Five feeds makes it ripe, and it pays 6 bones.</p>
<p><b>The maze</b>: <code>plant(Entities.Hedge)</code> rebuilds the whole farm as hedge walls with one
chest hidden inside. <code>move()</code> returns False into a wall, so a depth-first search with a
visited set will find it. Every fifth chest reshuffles the maze.</p>

<h2>The market</h2>
<p><code>trade(item, n)</code> converts goods to gold at a fixed rate — hay is worth the least, bones the
most — and whatever <code>get_trade_request()</code> names pays triple until the market moves on.
Gold buys the last upgrades.</p>

<h2>The language</h2>
<p>Real Python syntax, a practical subset of it: variables, arithmetic, <code>if/elif/else</code>,
<code>while</code>, <code>for … in</code>, <code>def</code> with defaults and <code>*args</code>,
<code>return</code>, <code>break</code>, <code>continue</code>, <code>global</code>, lambdas,
comprehensions, f-strings, <code>try/except</code>, and the usual lists, tuples, dicts, sets, strings
with their common methods. No classes, imports, generators or file access.</p>
<p class="note">Functions you define stick around between runs, so you can keep a file of helpers and
call them from another file. <b>Reset globals</b> in the Log tab clears them.</p>

<h2>On a phone</h2>
<p>The row under the editor inserts snippets and a four-space indent at the cursor. Enter keeps your
indentation and adds a level after a colon. Everything saves to this device automatically.</p>
<div class="foot"><span class="tag">tap a tile to inspect it</span><span class="tag">code runs only while Run is lit</span></div>`;
}

/* =============================== wiring ================================= */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===t));
  const id=t.dataset.pane;
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+id));
  if(id==='shop') UI.refreshShop();
  if(id==='guide') renderGuide();
}));

$('runBtn').addEventListener('click',()=>{
  files[active].code=$('code').value;
  save();
  startRun(files[active].code,files[active].name);
});
$('stopBtn').addEventListener('click',()=>stopRun(false));
$('speed').addEventListener('input',e=>{
  state.speedPref=Math.min(+e.target.value,state.speed);
  e.target.value=String(state.speedPref);
  $('tps').textContent=TPS[state.speedPref]+'/s';
  saveSoon();
});

$('files').addEventListener('click',e=>{
  const b=e.target.closest('[data-file]'); if(!b) return;
  const v=b.dataset.file;
  if(v==='new'){
    const n=prompt('File name','script'+(files.length+1)+'.py');
    if(!n) return;
    files.push({name:n.trim(),code:'# '+n.trim()+'\n'});
    loadFile(files.length-1); saveSoon(); return;
  }
  if(v==='del'){
    if(files.length<2||!confirm('Delete '+files[active].name+'?')) return;
    files.splice(active,1); loadFile(Math.max(0,active-1)); saveSoon(); return;
  }
  loadFile(+v);
});

$('keys').innerHTML=KEYS.map((k,i)=>
  '<button class="key'+(k[1].length>6?' wide':'')+'" data-k="'+i+'">'+esc(k[0])+'</button>').join('');
$('keys').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]'); if(!b) return;
  const k=KEYS[+b.dataset.k];
  insert(k[1],k[2]||0);
});

const ta=$('code');
ta.addEventListener('input',onEdit);
ta.addEventListener('scroll',()=>{ $('hl').scrollTop=ta.scrollTop; $('hl').scrollLeft=ta.scrollLeft; });
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){ e.preventDefault(); insert('    '); return; }
  if(e.key==='Enter'){
    const s=ta.selectionStart;
    const line=ta.value.slice(0,s).split('\n').pop();
    const ind=(/^[ \t]*/.exec(line)||[''])[0];
    const extra=/:\s*$/.test(line)?'    ':'';
    e.preventDefault();
    insert('\n'+ind+extra);
  }
});

$('shop').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.buy){ const u=UPGRADES.find(x=>x.id===b.dataset.buy); if(u) buy(u); return; }
  const a=b.dataset.act;
  if(a==='fert'){
    if(state.items.Gold>=2){ state.items.Gold-=2; give('Fertilizer',10);
      UI.log('bought 10 fertilizer','s'); UI.refreshShop(); UI.refreshStats(true); save(); }
  } else if(a==='clear'){
    if(!confirm('Clear every plant on the farm?')) return;
    for(const t of world.tiles){ t.e=null; t.age=0; t.d=null; }
    world.maze=false; UI.log('field cleared','i'); save();
  } else if(a==='wipe') wipe();
});

$('clearLog').addEventListener('click',()=>UI.clearLog());
$('resetGlobals').addEventListener('click',()=>resetGlobals());
$('clearFarm').addEventListener('click',()=>{
  for(const t of world.tiles){ t.e=null; t.age=0; t.d=null; }
  world.maze=false; UI.log('field cleared','i'); save();
});

let inspect=null;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), n=world.size;
  const cell=Math.floor(Math.min((r.width-12)/n,(r.height-12)/n));
  const ox=(r.width-cell*n)/2, oy=(r.height-cell*n)/2;
  const gx=Math.floor((e.clientX-r.left-ox)/cell);
  const gy=n-1-Math.floor((e.clientY-r.top-oy)/cell);
  if(gx<0||gy<0||gx>=n||gy>=n){ inspect=null; return; }
  inspect={x:gx,y:gy,t:performance.now()};
});
function readout(){
  const D=world.drone;
  let s='<span>x <b>'+D.x+'</b> y <b>'+D.y+'</b></span><span>t <b>'+Math.floor(world.time)+'</b></span>';
  if(inspect && performance.now()-inspect.t<6000){
    const t=tileAt(inspect.x,inspect.y);
    const sp=t.e?SPEC[t.e]:null;
    let d=t.e||'empty';
    if(t.e==='Sunflower') d+=' '+t.d.petals+'p';
    if(t.e==='Cactus') d+=' size '+t.d.size;
    if(t.e==='Dinosaur') d+=' '+t.d.fed+'/5 wants '+t.d.want;
    if(sp&&sp.grow) d+=' '+Math.floor(Math.min(1,t.age/sp.grow)*100)+'%';
    s+='<span>('+inspect.x+','+inspect.y+') '+t.g.toLowerCase()+
      (t.g==='Soil'?' '+Math.round(t.water*100)+'%':'')+' <b>'+esc(d)+'</b></span>';
  }
  $('readout').innerHTML=s;
}

/* =============================== main loop =============================== */
let lastT=0, readoutAt=0;
function loop(ts){
  const dt=Math.min(0.06,lastT?(ts-lastT)/1000:0.016);
  lastT=ts;
  if(runner.running) stepProgram(dt);
  draw(dt);
  if(ts-readoutAt>90){ readoutAt=ts; readout(); UI.refreshStats(); }
  requestAnimationFrame(loop);
}

document.addEventListener('visibilitychange',()=>{ if(document.hidden){ files[active].code=ta.value; save(); } });
window.addEventListener('pagehide',()=>{ files[active].code=ta.value; save(); });

/* ================================= boot ================================== */
load();
resizeCanvas();
renderFiles();
loadFile(active);
UI.syncSpeed();
UI.refreshShop();
UI.refreshStats(true);
renderGuide();
if(!logLines.length){
  UI.log('Rootloop ready. Press Run to start the drone.','s');
  UI.log('Tip: the Guide tab has the full command list.','i');
}
UI.flag('idle');
requestAnimationFrame(loop);
</script>
